name: Bootstrap reqmap source
on:
  push:
    paths:
      - .reqmap-seed.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .reqmap-seed.b64 | tar -xJf -
          rm .reqmap-seed.b64 .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish reqmap Codex Skill"
          git push
